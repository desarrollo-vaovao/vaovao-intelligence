[pytest]
# rootdir = intelligence-backend/, para que `app` sea importable sin instalar
# el paquete ni tocar PYTHONPATH a mano.
pythonpath = .
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
markers =
    postgres: requiere PostgreSQL real (USE_POSTGRES_CONTAINER=true). Se
        auto-skipea sobre SQLite: ver tests/conftest.py (fixture
        `require_postgres`) y el docstring de cada archivo test_*postgres*
        / test_migracion_vs_modelo.py / test_concurrencia_ingest_lead.py /
        test_busqueda_acentos.py / test_cascada_real_bd.py.
filterwarnings =
    ignore::DeprecationWarning
