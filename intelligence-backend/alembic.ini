# Configuración de Alembic — VaoVao Intelligence.
#
# OJO: aquí NO hay `sqlalchemy.url`, y es a propósito.
# La URL la pone `alembic/env.py` leyendo `settings.database_url_normalized`
# (app/core/config.py), la misma que usa la app. Duplicarla aquí significaría
# que un día las migraciones corren contra una base y la app contra otra —y en
# Railway la URL ni siquiera es fija: viene de ${{Postgres.DATABASE_URL}}, a
# veces con el esquema `postgres://` que psycopg2 no entiende y que
# `database_url_normalized` corrige.

[alembic]
script_location = alembic

# Para que `alembic` encuentre el paquete `app` al ejecutarse desde
# intelligence-backend/.
prepend_sys_path = .

# Nombre de archivo de cada revisión: el orden alfabético es el cronológico.
file_template = %%(rev)s_%%(slug)s

# Zona horaria de las fechas dentro de los archivos generados.
timezone = UTC


# ── Logging ──────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
